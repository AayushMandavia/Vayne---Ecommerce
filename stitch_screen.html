<title>VAYNE — Select Department</title>
<!-- Tailwind CSS v3 -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts: Anton (Heavy Condensed Display) & Space Grotesk / Inter -->
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Space+Grotesk:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            display: ['Anton', 'sans-serif'],
            mono: ['"Space Grotesk"', 'monospace', 'sans-serif'],
            sans: ['"Space Grotesk"', 'sans-serif'],
          },
          colors: {
            brand: {
              black: '#000000',
              white: '#ffffff',
              muted: '#767676',
              border: '#e5e5e5',
            }
          },
          letterSpacing: {
            'ultra-wide': '0.22em',
            'tightest': '-0.035em',
          }
        }
      }
    }
  </script>
<!-- Custom Typography and Micro-Interactions -->
<style data-purpose="custom-typography">
    .font-condensed-impact {
      font-family: 'Anton', sans-serif;
      text-transform: uppercase;
      letter-spacing: -0.015em;
      line-height: 0.88;
    }
  </style>
<style data-purpose="row-interactions">
    .collection-row {
      transition: background-color 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .collection-row .arrow-icon {
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), background-color 0.35s ease, color 0.35s ease;
    }
    .collection-row:hover .arrow-icon {
      transform: translate(6px, -6px);
      background-color: #000000;
      color: #ffffff;
    }
    .collection-row .department-title {
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
    }
    .collection-row:hover .department-title {
      transform: translateX(12px);
    }
    .collection-row:hover {
      background-color: rgba(0, 0, 0, 0.015);
    }
  </style>
</head>
<body class="bg-white text-brand-black min-h-screen flex flex-col font-sans selection:bg-black selection:text-white antialiased">

<header class="w-full border-b border-brand-border sticky top-0 bg-white/95 backdrop-blur-sm z-50">

<p class="text-sm md:text-base text-neutral-800 leading-relaxed font-normal">

                </p>
</div>
<!-- Interactive Arrow -->
<div class="arrow-icon w-12 h-12 rounded-full border border-neutral-300 flex items-center justify-center shrink-0 self-start sm:self-center">

<line x1="7" x2="17" y1="17" y2="7"></line>
<polyline points="7 7 17 7 17 17"></polyline>

</div>
</div>
</div>
