<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fashion Preloader (White Background)</title>
  <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #ffffff;
      color: #000000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }
    .player-wrapper {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      position: relative;
    }
    lottie-player {
      width: 100%;
      height: 100%;
      max-width: 1200px;
      max-height: 700px;
    }
  </style>
</head>
<body>
  <div class="player-wrapper">
    <lottie-player
      id="fashionPlayer"
      src="/preloader.json"
      background="#ffffff"
      speed="1"
      autoplay>
    </lottie-player>
  </div>
</body>
</html>
