<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VAYNE Editorial Lookbook Preloader</title>
  <script src="/lottie-player.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      background-color: #ffffff;
      background: #ffffff;
      color: #000000;
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .player-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #ffffff;
      background: #ffffff;
      position: relative;
    }
    lottie-player {
      width: 100%;
      height: 100%;
      max-width: 1366px;
      max-height: 768px;
      background-color: #ffffff;
      background: #ffffff;
    }
  </style>
</head>
<body>
  <div class="player-container">
    <lottie-player
      id="vaynePlayer"
      src="/preloader.json"
      background="#ffffff"
      speed="1"
      autoplay>
    </lottie-player>
  </div>
</body>
</html>
